# Контейнеры стенда Codespaces: приложение и PostgreSQL. Сеть общая (network_mode), база доступна на localhost:5432.
services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:1-24-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    network_mode: service:db
    environment:
      TZ: UTC

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      # Пароль только для изолированного стенда разработки внутри Codespace (порт наружу не публикуется).
      POSTGRES_USER: booking_app
      POSTGRES_PASSWORD: booking_dev_only
      POSTGRES_DB: booking_dev
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
