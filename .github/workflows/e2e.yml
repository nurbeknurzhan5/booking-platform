# E2E (Playwright: ноутбук, монитор, планшет, телефон) на полном стенде с демо-данными. Запуск вручную:
# Actions → E2E → Run workflow. Публичные лимиты не ослабляются, поэтому прогон долгий (~10 минут).
name: E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright на 4 устройствах
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: booking_app
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: booking_dev
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U booking_app"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CI: 'true'
      APP_ENV: development
      DATABASE_URL: postgresql://booking_app:ci_only_password@localhost:5432/booking_dev?schema=public
      NOTIFICATION_CHANNELS: dev_inbox
      WEB_ORIGIN: http://localhost:3000
      PUBLIC_BASE_URL: http://localhost:3000
      COOKIE_SECURE: 'false'
      STORAGE_DRIVER: local
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Одноразовые секреты
        run: |
          for k in OTP_HMAC_SECRET ENCRYPTION_KEY ANALYTICS_SECRET; do
            echo "$k=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64'))")" >> "$GITHUB_ENV"
          done
      - run: npm ci --no-audit --no-fund
      - name: Сборка
        run: npm run build
      - name: Миграции и демо-данные
        working-directory: apps/api
        run: |
          npx prisma migrate deploy
          npx tsx prisma/seed.ts --demo
      - name: Браузер Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: E2E
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
