# Проверки при каждом push в main и pull request: линтер, типы, unit и integration-тесты на PostgreSQL 17, сборка.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Линтер, типы, тесты, сборка
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: booking_app
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: booking_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U booking_app"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: test
      # Тесты используют только TEST_DATABASE_URL; DATABASE_URL обязан отличаться (защита от запуска на рабочей базе)
      DATABASE_URL: postgresql://booking_app:ci_only_password@localhost:5432/booking_unused?schema=public
      TEST_DATABASE_URL: postgresql://booking_app:ci_only_password@localhost:5432/booking_test?schema=public
      NOTIFICATION_CHANNELS: dev_inbox
      # «Тестовый телефон» включается только явным флагом (тестам он нужен: OTP и ссылки читаются из dev_inbox)
      DEV_INBOX_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Одноразовые секреты для тестов
        run: |
          for k in OTP_HMAC_SECRET ENCRYPTION_KEY ANALYTICS_SECRET; do
            echo "$k=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64'))")" >> "$GITHUB_ENV"
          done
      - run: npm ci --no-audit --no-fund
      - name: Общий пакет и клиент Prisma
        run: |
          npm run build -w @booking/shared
          (cd apps/api && npx prisma generate)
      - run: npm run lint
      # Сборка до проверки типов: next build создаёт next-env.d.ts (типы Next для css и изображений)
      - name: Сборка API и сайта
        run: |
          npm run build -w @booking/api
          npm run build -w @booking/web
      - run: npm run typecheck
      - name: Unit и integration-тесты
        run: npm test

  # Образы production и конфигурация docker compose (без запуска контейнеров).
  docker:
    name: Docker-образы и compose
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Проверка docker-compose.prod.yml с примером переменных
        run: docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod.example config --quiet
      - name: Образ API и воркера
        run: docker build -f infra/docker/api.Dockerfile -t booking-api:ci .
      - name: Образ сайта
        run: docker build -f infra/docker/web.Dockerfile -t booking-web:ci .
      - name: Fail-closed конфигурация в образе API
        run: |
          # NODE_ENV=production (задан в образе) без APP_ENV: API и воркер завершаются с ошибкой конфигурации
          for entry in dist/main.js dist/worker.js; do
            set +e
            out="$(timeout 60 docker run --rm booking-api:ci node "$entry" 2>&1)"
            code=$?
            set -e
            echo "$entry -> exit $code"; echo "$out" | tail -n 3
            [ "$code" -ne 0 ] && [ "$code" -ne 124 ] && echo "$out" | grep -q 'APP_ENV' || { echo "$entry стартовал без APP_ENV"; exit 1; }
          done
